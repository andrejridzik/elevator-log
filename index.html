<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a78d6">
  <title>Elevator Log</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page log-page">
    <header class="topbar">
      <h1>Elevator Log</h1>
      <div class="topbar-actions">
        <button class="user-chip" id="userChip" type="button" aria-label="Change your name"></button>
        <a class="icon-btn" href="analysis.html" aria-label="Analysis">📊</a>
      </div>
    </header>

    <section class="field-group">
      <div class="field-label"><span>Logging from floor</span></div>
      <div class="floor-picker-grid" id="floorStrip"></div>
    </section>

    <section class="elevator-columns">
      <div class="elevator-col small">
        <div class="elevator-col-header">
          <span class="name">Small</span>
          <span class="current-val" id="valSmall">–</span>
        </div>
        <div class="floor-grid" id="stripSmall"></div>
      </div>
      <div class="elevator-col large">
        <div class="elevator-col-header">
          <span class="name">Large</span>
          <span class="current-val" id="valLarge">–</span>
        </div>
        <div class="floor-grid" id="stripLarge"></div>
      </div>
    </section>

    <button class="log-btn" id="logBtn" disabled>Log</button>
  </div>
  <div class="toast" id="toast" hidden></div>

  <div class="modal-backdrop" id="nameModal" hidden>
    <div class="modal-card">
      <h2>Your name</h2>
      <p class="subtitle">Tags every entry you log, so logs from different phones can be combined later without losing track of who logged what.</p>
      <input type="text" id="nameInput" placeholder="Your name" maxlength="40" autocomplete="off">
      <button class="log-btn" id="nameSaveBtn" type="button">Save</button>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
